name: Bug report
description: Report a reproducible problem in LabGraph
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Enter…
        3. Export…
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Firefox 131 on Windows 11
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sample data or project file
      description: Attach a minimal non-sensitive example if it helps reproduce the issue.
